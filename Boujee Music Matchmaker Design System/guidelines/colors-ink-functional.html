<!-- @dsCard group="Colors" viewport="700x180" name="Violet & Coral" subtitle="The whole idea — deep violet against soft coral, used as fields not hairlines" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}
.row{display:flex;gap:16px}
.sw{flex:1;height:96px;border-radius:8px;display:flex;align-items:flex-end;padding:10px;font-size:13px;font-weight:600}
.sw span{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:4px}
</style></head><body>
<div class="row">
<div class="sw" style="background:var(--color-ink);color:var(--color-paper)"><span>Violet #26004D</span></div>
<div class="sw" style="background:var(--color-coral);color:var(--color-ink)"><span>Coral #EFB0A1</span></div>
<div class="sw" style="background:var(--color-ink-soft);color:var(--color-paper)"><span>Violet hover #3D1868</span></div>
</div>
</body></html>
