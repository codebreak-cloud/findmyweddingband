<!-- @dsCard group="Surfaces" viewport="700x200" name="Radius & Shadow" subtitle="Modest rounding, hairline borders over heavy shadow" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans);display:flex;gap:20px}
.box{width:140px;height:120px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted)}
</style></head><body>
<div class="box" style="border-radius:var(--radius-sm);border:1px solid var(--border-hairline)">radius-sm 4px</div>
<div class="box" style="border-radius:var(--radius-md);border:1px solid var(--border-hairline)">radius-md 8px</div>
<div class="box" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-card)">radius-lg + shadow-card</div>
</body></html>
