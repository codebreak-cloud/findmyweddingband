<!-- @dsCard group="Colors" viewport="700x200" name="Contrast Pairings" subtitle="Which pairs pass — coral is a fill, never body text on light" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{height:110px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;text-align:center;padding:8px}
</style></head><body>
<div class="box" style="background:var(--color-coral);color:var(--color-ink)">Violet on coral ✓</div>
<div class="box" style="background:var(--color-ice);color:var(--color-ink)">Violet on ice ✓</div>
<div class="box" style="background:var(--color-ink);color:var(--color-white)">White on violet ✓</div>
<div class="box" style="background:var(--color-ink);color:var(--color-coral)">Coral on violet ✓</div>
<div class="box" style="background:var(--color-paper);color:var(--color-coral);border:1px solid var(--border-hairline)">Coral on paper ✕ never</div>
</body></html>
