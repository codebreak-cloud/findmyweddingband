<!-- @dsCard group="Motion" viewport="700x200" name="Easing & Duration" subtitle="150–250ms, characterful but never slow" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans);display:flex;gap:32px}
.dot{width:24px;height:24px;border-radius:50%;background:var(--color-ink);animation:move 1.8s var(--ease-settle) infinite}
@keyframes move{0%,100%{transform:translateX(0)}50%{transform:translateX(60px)}}
.lbl{font-size:12px;color:var(--text-muted);margin-top:10px}
</style></head><body>
<div><div class="dot" style="animation-timing-function:var(--ease-standard)"></div><div class="lbl">ease-standard</div></div>
<div><div class="dot" style="animation-timing-function:var(--ease-settle)"></div><div class="lbl">ease-settle</div></div>
<div><div class="dot" style="animation-timing-function:var(--ease-press)"></div><div class="lbl">ease-press</div></div>
</body></html>
